site_name: Blackwell GPU Wiki（中文版）
site_description: SM100 与 SM120 的差异、NVFP4、tcgen05、消费级 Blackwell 上的 MoE 推理——一份独立的学习参考。
site_url: https://0xsero.github.io/blackwell-gpu-wiki/
repo_url: https://github.com/0xSero/blackwell-gpu-wiki
repo_name: 0xSero/blackwell-gpu-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/brightness-4
        name: 跟随系统
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.smartsymbols

plugins:
  - search:
      lang:
        - zh
        - en

# Material's built-in Mermaid integration
# (the superfences custom_fence above routes mermaid blocks to this)


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/0xSero/blackwell-gpu-wiki
  generator: false

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 总览:
    - overview/index.md
    - 架构一页图: overview/architecture.md
    - 上手指南: overview/getting-started.md
    - 术语表: overview/glossary.md
  - 基础:
    - fundamentals/index.md
    - GPU 执行模型: fundamentals/gpu-execution-model.md
    - 内存层次: fundamentals/memory-hierarchy.md
    - CUDA 编译流水线: fundamentals/cuda-pipeline.md
    - Tensor Core: fundamentals/tensor-cores.md
    - 数值格式: fundamentals/number-formats.md
  - Blackwell:
    - blackwell/index.md
    - SM100 与 SM120: blackwell/sm100-vs-sm120.md
    - tcgen05 与 TMEM: blackwell/tcgen05-and-tmem.md
    - 线程块簇: blackwell/thread-block-clusters.md
    - NVFP4 深入: blackwell/nvfp4-deep-dive.md
  - 内核库:
    - kernels/index.md
    - CUTLASS: kernels/cutlass.md
    - FlashAttention: kernels/flashattention.md
    - FlashInfer: kernels/flashinfer.md
    - DeepGEMM: kernels/deepgemm.md
    - Marlin 及同类: kernels/marlin-and-friends.md
    - Triton 与 TransformerEngine: kernels/triton-and-transformerengine.md
    - NVSHMEM 与 DeepEP: kernels/nvshmem-and-deepep.md
    - 推理引擎: kernels/inference-engines.md
  - 互连:
    - interconnect/index.md
    - NVLink 与 PCIe: interconnect/nvlink-vs-pcie.md
    - P2P 与原子操作: interconnect/p2p-and-atomics.md
    - MoE 并行: interconnect/moe-parallelism.md
  - 案例分析:
    - case-studies/index.md
    - DeepSeek V3 与 V4: case-studies/deepseek-v3-v4.md
    - Kimi K2: case-studies/kimi-k2.md
    - GLM-5: case-studies/glm-5.md
    - 通用 MoE: case-studies/generic-moe-on-consumer-blackwell.md
  - 兼容方案:
    - compatibility/index.md
    - 改写 tcgen05: compatibility/translating-tcgen05.md
    - SMEM 预算: compatibility/smem-budget-management.md
    - 改写 cluster: compatibility/cluster-rewriting.md
    - EP 改 TP: compatibility/ep-to-tp-rewriting.md
    - 运行时检测: compatibility/runtime-detection.md
  - 参考:
    - reference/index.md
    - 缩写表: reference/abbreviations.md
    - 参考文献: reference/bibliography.md
